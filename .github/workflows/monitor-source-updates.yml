name: Monitor source article updates

on:
  schedule:
    # 每小時第 47 分（UTC）檢查一次，和 monitor-feeds 錯開
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-source-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Compare source articles with snapshots
        run: node scripts/watch-source-updates.mjs --json > source-updates.json

      - name: Open issue for updated sources
        uses: actions/github-script@v7
        with:
          script: |
            const notify = require('./scripts/notify-source-updates.cjs');
            await notify({ github, context, core, reportPath: 'source-updates.json' });
